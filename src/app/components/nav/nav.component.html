<div
  class="fixed left-0 top-0 z-[130] h-[3px] bg-acc transition-[width] duration-100"
  [style.width.%]="progress()"
></div>

<header
  class="border-b bg-bg transition-colors duration-200 ease-smooth"
  [class.border-transparent]="!stuck()"
  [class.border-line]="stuck()"
>
  <div class="shell flex h-14 items-center justify-between gap-4 md:h-[68px]">
    <a routerLink="/" class="group inline-flex items-center gap-2.5">
      <span
        class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[4px] bg-navy font-mono
               text-[0.78rem] font-semibold tracking-tight text-white"
        aria-hidden="true"
      >NB</span>
      <span class="font-serif text-[1.05rem] font-bold tracking-tight">{{ profile.name }}</span>
    </a>

    <!-- desktop -->
    <nav class="hidden items-center gap-[clamp(0.9rem,2.4vw,1.9rem)] text-[0.94rem] md:flex" aria-label="Pages">
      @for (link of links; track link.path) {
        <a
          class="nav-link relative py-1 font-medium text-ink-2 transition-colors"
          [routerLink]="link.path"
          routerLinkActive="is-active"
        >{{ link.label }}</a>
      }
      <a
        class="rounded-md border border-navy bg-navy px-4 py-2 text-[0.88rem] font-semibold text-white
               transition-colors duration-200 hover:border-navy-deep hover:bg-navy-deep"
        [href]="profile.cv"
        target="_blank"
        rel="noopener"
      >Résumé</a>
    </nav>

    <!-- mobile: résumé stays one tap away in the top row -->
    <a
      class="rounded-md border border-navy bg-navy px-3 py-1.5 text-[0.82rem] font-semibold text-white md:hidden"
      [href]="profile.cv"
      target="_blank"
      rel="noopener"
    >Résumé</a>
  </div>

</header>

<!-- mobile: app-style bar pinned to the bottom of the screen -->
<nav class="tabbar" aria-label="Pages">
  @for (tab of tabs; track tab.path) {
    <a
      class="tab"
      [routerLink]="tab.path"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: tab.path === '/' }"
    >
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path [attr.d]="tab.icon" />
      </svg>
      <span>{{ tab.label }}</span>
    </a>
  }
</nav>
