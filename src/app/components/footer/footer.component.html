<footer class="border-t border-line">
  <div class="shell grid grid-cols-2 gap-8 py-12 md:grid-cols-4">
    <div class="col-span-2 md:col-span-1">
      <div class="text-[0.98rem] font-bold tracking-tight">{{ profile.name }}</div>
      <p class="mt-2 max-w-[28ch] text-[0.88rem] leading-relaxed text-ink-3">
        {{ profile.role }} — {{ profile.tagline }}
      </p>
    </div>

    <div>
      <div class="font-mono text-[0.68rem] uppercase tracking-[0.1em] text-ink-3">Pages</div>
      <ul class="mt-3 flex flex-col gap-2 text-[0.9rem] text-ink-2">
        <li><a class="transition-colors hover:text-acc" routerLink="/">Home</a></li>
        <li><a class="transition-colors hover:text-acc" routerLink="/work">Work</a></li>
        <li><a class="transition-colors hover:text-acc" routerLink="/about">About</a></li>
        <li><a class="transition-colors hover:text-acc" routerLink="/contact">Contact</a></li>
      </ul>
    </div>

    <div>
      <div class="font-mono text-[0.68rem] uppercase tracking-[0.1em] text-ink-3">Elsewhere</div>
      <ul class="mt-3 flex flex-col gap-2 text-[0.9rem] text-ink-2">
        <li>
          <a class="transition-colors hover:text-acc" [href]="profile.github" target="_blank" rel="noopener">GitHub ↗</a>
        </li>
        <li>
          <a class="transition-colors hover:text-acc" [href]="profile.linkedin" target="_blank" rel="noopener">LinkedIn ↗</a>
        </li>
        <li>
          <a class="transition-colors hover:text-acc" [href]="profile.cv" target="_blank" rel="noopener">Résumé ↓</a>
        </li>
      </ul>
    </div>

    <div>
      <div class="font-mono text-[0.68rem] uppercase tracking-[0.1em] text-ink-3">Contact</div>
      <ul class="mt-3 flex flex-col gap-2 text-[0.9rem] text-ink-2">
        <li>
          <a class="break-all transition-colors hover:text-acc" [href]="'mailto:' + profile.email">{{ profile.email }}</a>
        </li>
        <li class="text-ink-3">{{ profile.location }}</li>
      </ul>
    </div>
  </div>

  <div class="shell flex flex-wrap items-center justify-between gap-2 border-t border-line-soft py-6">
    <span class="font-mono text-[0.73rem] text-ink-3">© {{ year }} {{ profile.name }}</span>
    <span class="font-mono text-[0.73rem] text-ink-3">Built with Angular</span>
  </div>
</footer>
