<figure class="m-0">
  <!-- main view -->
  <button
    type="button"
    class="view block w-full overflow-hidden rounded-md border border-line-strong bg-bg-alt"
    [class.cursor-zoom-in]="!compact()"
    [class.cursor-default]="compact()"
    [attr.aria-label]="compact() ? null : 'Open ' + name() + ' screenshots full size'"
    [attr.tabindex]="compact() ? -1 : 0"
    (click)="open()"
  >
    @if (isMissing(active())) {
      <ng-container [ngTemplateOutlet]="placeholder" />
    } @else {
      <img
        [src]="current().src"
        [alt]="current().caption"
        loading="lazy"
        decoding="async"
        class="aspect-[16/10] w-full object-cover object-top"
        (error)="onError(active())"
      />
    }
  </button>

  <figcaption class="mt-2.5 flex items-baseline justify-between gap-3">
    <span class="text-[0.86rem] text-ink-2">{{ current().caption }}</span>
    @if (hasMany()) {
      <span class="shrink-0 font-mono text-[0.72rem] tabular-nums text-ink-3">
        {{ active() + 1 }} / {{ total() }}
      </span>
    }
  </figcaption>

  <!-- thumbnails -->
  @if (hasMany()) {
    <div class="mt-3 flex flex-wrap gap-2" role="tablist" [attr.aria-label]="name() + ' screenshots'">
      @for (shot of shots(); track shot.src; let i = $index) {
        <button
          type="button"
          role="tab"
          class="thumb h-14 w-20 shrink-0 overflow-hidden rounded-[3px] border-2 bg-bg-alt"
          [class.border-navy]="active() === i"
          [class.border-line]="active() !== i"
          [attr.aria-selected]="active() === i"
          [attr.aria-label]="shot.caption"
          (click)="select(i)"
        >
          @if (isMissing(i)) {
            <span class="flex h-full w-full items-center justify-center bg-bg-alt font-mono text-[0.6rem] text-ink-3">
              {{ i + 1 }}
            </span>
          } @else {
            <img
              [src]="shot.src"
              alt=""
              loading="lazy"
              decoding="async"
              class="h-full w-full object-cover object-top"
              (error)="onError(i)"
            />
          }
        </button>
      }
    </div>
  }
</figure>

<!-- lightbox -->
@if (lightbox()) {
  <div
    class="fixed inset-0 z-[120] flex flex-col bg-ink"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="name() + ' screenshots'"
  >
    <div class="flex items-center justify-between gap-4 border-b border-white/15 px-4 py-3">
      <span class="min-w-0 truncate text-[0.9rem] font-semibold text-white">{{ name() }}</span>
      <span class="shrink-0 font-mono text-[0.75rem] tabular-nums text-white/60">
        {{ active() + 1 }} / {{ total() }}
      </span>
      <button
        type="button"
        class="shrink-0 rounded border border-white/25 px-3 py-1.5 font-mono text-[0.72rem] uppercase tracking-wider text-white hover:bg-white/10"
        (click)="close()"
      >
        Close
      </button>
    </div>

    <div class="relative flex min-h-0 flex-1 items-center justify-center p-4">
      @if (isMissing(active())) {
        <div class="w-full max-w-3xl"><ng-container [ngTemplateOutlet]="placeholder" /></div>
      } @else {
        <img
          [src]="current().src"
          [alt]="current().caption"
          class="max-h-full max-w-full object-contain"
          (error)="onError(active())"
        />
      }

      @if (total() > 1) {
        <button
          type="button"
          class="nav-btn left-3"
          aria-label="Previous screenshot"
          (click)="step(-1)"
        >‹</button>
        <button
          type="button"
          class="nav-btn right-3"
          aria-label="Next screenshot"
          (click)="step(1)"
        >›</button>
      }
    </div>

    <p class="border-t border-white/15 px-4 py-3 text-center text-[0.88rem] text-white/75">
      {{ current().caption }}
    </p>
  </div>
}
