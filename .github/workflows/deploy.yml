name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# let a running deploy finish rather than cancelling it mid-publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # served from https://codescribe01.github.io/portfolio-nanu/, so every
      # asset and router link has to resolve under that sub-path
      - run: npx ng build --base-href /portfolio-nanu/

      # Pages has no SPA rewrite: it serves 404.html for any unknown path, so
      # handing it index.html makes deep links like /work and /about work
      - run: cp dist/portfolio-nanu/browser/index.html dist/portfolio-nanu/browser/404.html

      # stop Jekyll from stripping files and folders that begin with _
      - run: touch dist/portfolio-nanu/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/portfolio-nanu/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
